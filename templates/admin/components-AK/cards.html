<!-- Tambahkan justify-content-center di class row -->
<div class="row g-2 mb-4 w-100 m-0 justify-content-center">
    <div class="col-12 col-md-3 px-2 animate-entrance stagger-1">
        <div class="stats-card p-4 bg-white h-100 shadow-sm" style="border-radius:16px; border:1px solid #EBEBEB; border-left:5px solid #4E9F6D;">
            <small class="text-muted d-block mb-2" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Total Pemasukan</small>
            <div class="fw-bold mb-2" style="font-size:24px;color:#1B1714;font-family:'Poppins',sans-serif;">Rp {{ "{:,.0f}".format(total_pemasukan_card) }}</div>
        </div>
    </div>

    <div class="col-12 col-md-3 px-2 animate-entrance stagger-2">
        <div class="stats-card p-4 bg-white h-100 shadow-sm" style="border-radius:16px; border:1px solid #EBEBEB; border-left:5px solid #D96B62;">
            <small class="text-muted d-block mb-2" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Total Pengeluaran </small>
            <div class="fw-bold mb-2" style="font-size:24px;color:#1B1714;font-family:'Poppins',sans-serif;">Rp {{ "{:,.0f}".format(total_pengeluaran_card) }}</div>
        </div>
    </div>

    <div class="col-12 col-md-3 px-2 animate-entrance stagger-3">
        <div class="stats-card p-4 bg-white h-100 shadow-sm" style="border-radius:16px; border:1px solid #EBEBEB; border-left:5px solid #D36334;">
            <small class="text-muted d-block mb-2" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Saldo Aktif</small>
            <div class="fw-bold mb-2" style="font-size:24px;color:#1B1714;font-family:'Poppins',sans-serif;">Rp {{ "{:,.0f}".format(saldo_aktif) }}</div>
        </div>
    </div>
</div>
