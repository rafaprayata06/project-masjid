<div class="finance-tab-container border-bottom bg-white px-4 pt-3">
    <div class="d-flex gap-4">
        <a href="#" class="finance-tab active" data-filter="semua">
            Semua <span class="tab-badge">{{ total_transaksi }}</span>
        </a>
        <a href="#" class="finance-tab" data-filter="pemasukan">
            Pemasukan <span class="tab-badge">{{ total_pemasukan }}</span>
        </a>
        <a href="#" class="finance-tab" data-filter="pengeluaran">
            Pengeluaran <span class="tab-badge">{{ total_pengeluaran }}</span>
        </a>
    </div>
</div>

<form method="GET" action="/admin-keuangan/finance">
    <div class="row g-3 align-items-center mt-1">
        <div class="col-md-2">
            <select name="jenis" class="form-select rounded-pill">
                <option value="">Semua Jenis</option>
                <option value="PEMASUKAN" {% if request.args.get('jenis') == 'PEMASUKAN' %}selected{% endif %}>Pemasukan</option>
                <option value="PENGELUARAN" {% if request.args.get('jenis') == 'PENGELUARAN' %}selected{% endif %}>Pengeluaran</option>
            </select>
        </div>
        <div class="col-md-2">
            <select name="kategori_id" class="form-select rounded-pill">
                <option value="">Semua Kategori</option>
                {% for kategori in kategori_list %}
                <option value="{{ kategori.id }}" {% if request.args.get('kategori_id') == kategori.id|string %}selected{% endif %}>
                    {{ kategori.nama }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <select name="bulan" class="form-select rounded-pill">
                <option value="">Semua Bulan</option>
                {% for bulan in range(1,13) %}
                <option value="{{ bulan }}" {% if request.args.get('bulan') == bulan|string %}selected{% endif %}>
                    {{ bulan }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <input type="date" name="tanggal_awal" class="form-control rounded-pill" value="{{ request.args.get('tanggal_awal', '') }}">
        </div>
        <div class="col-md-2">
            <input type="date" name="tanggal_akhir" class="form-control rounded-pill" value="{{ request.args.get('tanggal_akhir', '') }}">
        </div>
        <div class="col-md-1">
            <button type="submit" class="btn w-100 rounded-pill text-white" style="background:#E2660E; border:none;">
                <i class="bi bi-search"></i>
            </button>
        </div>
        <div class="col-md-1">
            <a href="/admin-keuangan/finance" class="btn btn-outline-secondary w-100 rounded-pill">Reset</a>
        </div>
    </div>
</form>
