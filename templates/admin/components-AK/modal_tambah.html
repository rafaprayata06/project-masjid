<div class="modal fade" id="modalTambahTransaksi" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            
            <div class="modal-header modal-header-custom d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold" style="color: #1B1714; display: flex; align-items: center; gap: 10px;">
                    <div style="background: #F4FBF7; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #2C7A5C; font-size: 16px;">
                        <i class="bi bi-wallet2"></i>
                    </div>
                    Tambah Transaksi Baru
                </h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="/admin-keuangan/finance/store" method="POST" enctype="multipart/form-data" class="needs-validation" id="formTambahTransaksi" novalidate>
                <input type="hidden" name="user_nim" value="{{ current_user.nim }}">
                
                <div class="modal-body modal-body-custom">
                    
                    <div class="mb-3">
                        <label class="form-label-custom">TANGGAL TRANSAKSI</label>
                        <input type="datetime-local" name="created_at" class="form-control-custom" required>
                        <div class="invalid-feedback">Tanggal transaksi wajib diisi.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label-custom">JENIS TRANSAKSI</label>
                        <div class="type-toggle-wrapper">
                            <input class="type-radio" type="radio" name="jenis_filter" id="pemasukan" value="PEMASUKAN" checked>
                            <label class="type-label" for="pemasukan">
                                <i class="bi bi-arrow-down-left-circle-fill text-success" style="font-size: 16px;"></i> Pemasukan
                            </label>

                            <input class="type-radio" type="radio" name="jenis_filter" id="pengeluaran" value="PENGELUARAN">
                            <label class="type-label" for="pengeluaran">
                                <i class="bi bi-arrow-up-right-circle-fill text-danger" style="font-size: 16px;"></i> Pengeluaran
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label-custom">KATEGORI</label>
                        <select id="kategoriSelect" name="kategori_id" class="form-select-custom" required>
                            <option value="">Pilih Kategori</option>
                            {% for kategori in kategori_list %}
                            <option value="{{ kategori.id }}" data-jenis="{{ kategori.jenis }}">{{ kategori.nama }}</option>
                            {% endfor %}
                        </select>
                        <div class="invalid-feedback">Silakan pilih kategori.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label-custom">NOMINAL (RP)</label>
                        <input type="text" id="displayNominal" class="form-control-custom" placeholder="0" required style="font-size: 20px; font-weight: 800; color: #1B1714 !important;">
                        <input type="hidden" name="jumlah" id="realNominal">
                        <div class="invalid-feedback">Nominal wajib diisi dan harus lebih dari Rp 0.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label-custom">KETERANGAN</label>
                        <textarea name="keterangan" id="keteranganInput" rows="3" class="form-control-custom" placeholder="Masukkan detail transaksi..." required></textarea>
                        <div class="invalid-feedback">Keterangan wajib diisi.</div>
                    </div>
                    
                    <div id="buktiSection" class="bukti-wrapper d-none">
                        <label class="form-label-custom">BUKTI TRANSAKSI</label>
                        <input type="file" name="bukti_transaksi" id="buktiInput" class="form-control-custom" accept=".jpg,.jpeg,.png,.webp,image/*" style="padding: 9px 16px !important;">
                        <div class="invalid-feedback">Bukti transaksi wajib diupload untuk transaksi pengeluaran.</div>
                        
                        <div id="previewContainer" class="position-relative mt-3 d-none">
                            <img id="previewImage" class="img-fluid rounded shadow-sm border" style="max-height:200px; width:100%; object-fit:cover; border-radius: 12px !important;">
                            <button type="button" id="removePreview" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2" style="border-radius: 8px;">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                    
                </div>
                
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn btn-batal-custom px-4 py-2" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-simpan-custom px-4 py-2">
                        <i class="bi bi-save2 me-2"></i>Simpan Transaksi
                    </button>
                </div>
                
            </form>
        </div>
    </div>
</div>
