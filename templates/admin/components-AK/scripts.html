<script>
// ===================================================================================
// FUNGSI GLOBAL (Wajib di luar DOMContentLoaded biar bisa dipanggil onclick HTML)
// ===================================================================================
function konfirmasiHapus(id) {
    Swal.fire({
        title: 'Yakin mau hapus?',
        text: "Data transaksi ID " + id + " bakal hilang permanen!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: 'Ya, hapus aja!',
        cancelButtonText: 'Batal'
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = "/admin-keuangan/finance/delete/" + id;
        }
    });
}

document.addEventListener("DOMContentLoaded", function () {

    // ===================================================================================
    // 1. OPERASIONAL FORM TAMBAH TRANSAKSI
    // ===================================================================================
    const pemasukanRadio = document.getElementById('pemasukan');
    const pengeluaranRadio = document.getElementById('pengeluaran');
    const kategoriSelect = document.getElementById('kategoriSelect');
    const buktiSection = document.getElementById('buktiSection');
    const buktiInput = document.getElementById('buktiInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const removePreview = document.getElementById('removePreview');
    const displayNominal = document.getElementById('displayNominal');
    const realNominal = document.getElementById('realNominal');
    const keteranganInput = document.getElementById('keteranganInput');
    const formTambah = document.getElementById('formTambahTransaksi');

    if (displayNominal) {
        displayNominal.addEventListener('input', function() {
            let angka = this.value.replace(/\D/g, '');
            realNominal.value = angka;
            this.value = Number(angka || 0).toLocaleString('id-ID');
            if (Number(angka) > 0) {
                this.setCustomValidity('');
                this.classList.remove('is-invalid', 'is-valid');
            }
        });
    }

    function filterKategoriTambah() {
        if (!kategoriSelect || !pemasukanRadio) return;
        const jenisAktif = pemasukanRadio.checked ? 'PEMASUKAN' : 'PENGELUARAN';
        Array.from(kategoriSelect.options).forEach(option => {
            if (option.value === '') return;
            option.hidden = (option.dataset.jenis !== jenisAktif);
            option.disabled = (option.dataset.jenis !== jenisAktif);
        });
        kategoriSelect.value = '';
        kategoriSelect.classList.remove('is-invalid', 'is-valid');
    }

    function toggleBuktiTambah() {
        if (!buktiSection || !pengeluaranRadio || !buktiInput || !previewImage || !previewContainer) return;
        if (pengeluaranRadio.checked) {
            buktiSection.classList.remove('d-none');
        } else {
            buktiSection.classList.add('d-none');
            buktiInput.value = '';
            buktiInput.setCustomValidity('');
            buktiInput.classList.remove('is-invalid', 'is-valid');
            previewImage.src = '';
            previewContainer.classList.add('d-none');
        }
    }

    if (pemasukanRadio && pengeluaranRadio) {
        pemasukanRadio.addEventListener('change', () => { filterKategoriTambah(); toggleBuktiTambah(); });
        pengeluaranRadio.addEventListener('change', () => { filterKategoriTambah(); toggleBuktiTambah(); });
    }

    if (buktiInput) {
        buktiInput.addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                this.setCustomValidity('Format file tidak valid');
                this.classList.add('is-invalid');
                this.reportValidity();
                this.value = '';
                return;
            }
            this.setCustomValidity('');
            this.classList.remove('is-invalid');
            const reader = new FileReader();
            reader.onload = function (e) {
                previewImage.src = e.target.result;
                previewContainer.classList.remove('d-none');
            }
            reader.readAsDataURL(file);
        });
    }

    if (removePreview) {
        removePreview.addEventListener('click', function () {
            buktiInput.value = '';
            previewImage.src = '';
            previewContainer.classList.add('d-none');
            buktiInput.classList.remove('is-valid');
        });
    }

    if (formTambah) {
        formTambah.addEventListener('submit', function(event) {
            displayNominal.setCustomValidity('');
            displayNominal.classList.remove('is-invalid', 'is-valid');
            keteranganInput.setCustomValidity('');
            keteranganInput.classList.remove('is-invalid', 'is-valid');
            buktiInput.setCustomValidity('');
            buktiInput.classList.remove('is-invalid', 'is-valid');

            if (!keteranganInput.value.trim()) {
                keteranganInput.setCustomValidity('Keterangan wajib diisi');
                keteranganInput.classList.add('is-invalid');
            } else {
                keteranganInput.classList.add('is-valid');
            }

            if (!realNominal.value || Number(realNominal.value) <= 0) {
                displayNominal.setCustomValidity('Nominal wajib diisi');
                displayNominal.classList.add('is-invalid');
            } else {
                displayNominal.classList.add('is-valid');
            }

            if (pengeluaranRadio.checked && buktiInput.files.length === 0) {
                buktiInput.setCustomValidity('Bukti transaksi wajib diupload');
                buktiInput.classList.add('is-invalid');
            } else if (pengeluaranRadio.checked) {
                buktiInput.classList.add('is-valid');
            }

            if (!formTambah.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            formTambah.classList.add('was-validated');
        }, false);
    }

    filterKategoriTambah();
    toggleBuktiTambah();


    // ===================================================================================
    // 2. FUNGSI BINDING MODAL EDIT (Dibuat function agar bisa dipanggil ulang pas AJAX)
    // ===================================================================================
    function attachModalListeners() {
        document.querySelectorAll('.nominal-display').forEach(input => {
            input.oninput = function() {
                let realInput = this.parentElement.querySelector('.nominal-real');
                let angka = this.value.replace(/\D/g,'');
                realInput.value = angka;
                this.value = Number(angka || 0).toLocaleString('id-ID');
                if(Number(angka) > 0) {
                    this.setCustomValidity('');
                    this.classList.remove('is-invalid', 'is-valid');
                }
            };
        });

        document.querySelectorAll('.bukti-input').forEach(input => {
            input.onchange = function() {
                const file = this.files[0];
                if (!file) return;
                const ext = file.name.split('.').pop().toLowerCase();
                if(!['jpg','jpeg','png','webp'].includes(ext)){
                    this.setCustomValidity('Format file tidak valid');
                    this.classList.add('is-invalid');
                    this.reportValidity();
                    this.value = '';
                    return;
                }
                this.setCustomValidity('');
                this.classList.remove('is-invalid');
                const reader = new FileReader();
                const wrapper = this.parentElement.querySelector('.preview-baru');
                const img = wrapper.querySelector('.gambar-preview');
                reader.onload = e => {
                    img.src = e.target.result;
                    wrapper.classList.remove('d-none');
                };
                reader.readAsDataURL(file);
            };
        });

        document.querySelectorAll('.hapus-preview').forEach(btn => {
            btn.onclick = function() {
                const wrapper = this.closest('.preview-baru');
                wrapper.classList.add('d-none');
                const section = this.closest('.bukti-edit-section');
                section.querySelector('.bukti-input').value = '';
            };
        });

        document.querySelectorAll('[id^="editTransaksi"]').forEach(modal => {
            const formEditInstance = modal.querySelector('.form-edit-transaksi');
            const radiosEdit = modal.querySelectorAll('.jenis-edit');
            const kategoriEdit = modal.querySelector('.kategori-edit');
            const buktiSectionEdit = modal.querySelector('.bukti-edit-section');
            const buktiInputEdit = modal.querySelector('.bukti-input');

            function filterKategoriEdit() {
                const radioChecked = modal.querySelector('.jenis-edit:checked');
                if (!radioChecked || !kategoriEdit) return;
                const jenis = radioChecked.value;
                kategoriEdit.querySelectorAll('option').forEach(opt => {
                    opt.hidden = opt.dataset.jenis !== jenis;
                });
                if (jenis === 'PENGELUARAN') {
                    if (buktiSectionEdit) buktiSectionEdit.classList.remove('d-none');
                } else {
                    if (buktiSectionEdit) buktiSectionEdit.classList.add('d-none');
                    if (buktiInputEdit) {
                        buktiInputEdit.setCustomValidity('');
                        buktiInputEdit.classList.remove('is-invalid', 'is-valid');
                    }
                }
            }

            radiosEdit.forEach(radio => { radio.onchange = filterKategoriEdit; });
            filterKategoriEdit();

            if (formEditInstance) {
                formEditInstance.onsubmit = function(e) {
                    const radioChecked = modal.querySelector('.jenis-edit:checked');
                    const jenis = radioChecked ? radioChecked.value : '';
                    const nominalDisplayEdit = modal.querySelector('.nominal-display');
                    const nominalRealEdit = modal.querySelector('.nominal-real');
                    const keteranganInputEdit = modal.querySelector('.keterangan-edit');
                    
                    nominalDisplayEdit.setCustomValidity('');
                    nominalDisplayEdit.classList.remove('is-invalid', 'is-valid');
                    buktiInputEdit.setCustomValidity('');
                    buktiInputEdit.classList.remove('is-invalid', 'is-valid');
                    keteranganInputEdit.setCustomValidity('');
                    keteranganInputEdit.classList.remove('is-invalid', 'is-valid');

                    if (!keteranganInputEdit.value.trim()) {
                        keteranganInputEdit.setCustomValidity('Keterangan wajib diisi');
                        keteranganInputEdit.classList.add('is-invalid');
                    } else {
                        keteranganInputEdit.classList.add('is-valid');
                    }

                    if(!nominalRealEdit.value || Number(nominalRealEdit.value) <= 0){
                        nominalDisplayEdit.setCustomValidity('Nominal wajib diisi');
                        nominalDisplayEdit.classList.add('is-invalid');
                    } else {
                        nominalDisplayEdit.classList.add('is-valid');
                    }

                    if(jenis === 'PENGELUARAN'){
                        const adaFileBaru = buktiInputEdit.files.length > 0;
                        const adaFileLama = modal.querySelector('.preview-lama') !== null;
                        if(!adaFileBaru && !adaFileLama){
                            buktiInputEdit.setCustomValidity('Bukti transaksi wajib diupload');
                            buktiInputEdit.classList.add('is-invalid');
                        } else {
                            buktiInputEdit.classList.add('is-valid');
                        }
                    }

                    if (!formEditInstance.checkValidity()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    formEditInstance.classList.add('was-validated');
                };
            }
        });
    }

    // Jalankan saat web pertama kali dibuka
    attachModalListeners();


    // ===================================================================================
    // 3. AUTO-SUBMIT DENGAN FETCH AJAX
    // ===================================================================================
    const searchInput = document.querySelector('#filterFormAK input[name="q"]');
    const filterForm = document.getElementById('filterFormAK');
    let debounceTimer = null;

    if (searchInput && filterForm) {
        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            
            if (searchInput.value.trim() !== '') {
                searchInput.style.borderColor = '#E2660E';
                searchInput.style.boxShadow = '0 0 0 4px rgba(226, 102, 14, 0.15)';
            } else {
                searchInput.style.borderColor = '';
                searchInput.style.boxShadow = '';
            }

            debounceTimer = setTimeout(() => {
                const formData = new FormData(filterForm);
                const params = new URLSearchParams(formData).toString();

                fetch(`/admin-keuangan/finance/partial?${params}`)
                    .then(response => response.text())
                    .then(htmlData => {
                        const tableContainer = document.getElementById('tableContainerAK') || document.querySelector('.table-responsive');
                        
                        if (tableContainer) {
                            tableContainer.innerHTML = htmlData;
                            // PENTING: Pasang ulang event listener ke modal-modal hasil AJAX baru!
                            attachModalListeners();
                        } else {
                            console.warn("Kontainer pembungkus tabel tidak ditemukan.");
                        }
                    })
                    .catch(err => console.error("Gagal mengambil data search:", err));
            }, 500); 
        });
    }

}); // <-- INI DIA KURUNG TUTUP DOMContentLoaded YANG TADI HILANG
</script>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            {% for category, message in messages %}
            Swal.fire({
                title: "{{ 'Berhasil!' if category == 'success' else 'Info' }}",
                text: "{{ message }}",
                icon: "{{ category }}", 
                confirmButtonColor: '#E8631C'
            });
            {% endfor %}
        });
    </script>
    {% endif %}
{% endwith %}
