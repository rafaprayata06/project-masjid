<div class="row g-3 mb-4">
    <!-- Card Saldo -->
    <div class="col-md-4">
        <div class="card p-3 border-0 shadow-sm rounded-4">
            <span class="text-muted small">Saldo Masjid</span>
            <h4 class="fw-bold text-dark mt-1">Rp {{ "{:,.0f}".format(stats.saldo_masjid).replace(',', '.') }}</h4>
            <small class="text-success"><i class="bi bi-arrow-up"></i> Real-time aktif</small>
        </div>
    </div>
    <!-- Card Total Admin -->
    <div class="col-md-4">
        <div class="card p-3 border-0 shadow-sm rounded-4">
            <span class="text-muted small">Total Pengguna Sistem</span>
            <h4 class="fw-bold text-dark mt-1">{{ stats.total_admin }} User</h4>
            <small class="text-primary">Admin terdaftar</small>
        </div>
    </div>
    <!-- Card Berita -->
    <div class="col-md-4">
        <div class="card p-3 border-0 shadow-sm rounded-4">
            <span class="text-muted small">Berita Dipublikasi</span>
            <h4 class="fw-bold text-dark mt-1">{{ stats.berita_publish }} Berita</h4>
            <small class="text-warning">{{ stats.berita_draft }} draft tersimpan</small>
        </div>
    </div>
</div>
