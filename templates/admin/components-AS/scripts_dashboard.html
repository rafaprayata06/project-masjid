<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script>
    // 1. SETTINGAN GRAFIK ARUS KAS (BAR CHART)
    var optionsArusKas = {
        series: [{
            name: 'Pemasukan',
            data: [110, 120, 135, 125, 140, 155]
        }, {
            name: 'Pengeluaran',
            data: [80, 85, 100, 95, 110, 105]
        }],
        chart: {
            type: 'bar',
            height: 350,
            toolbar: { show: false }
        },
        colors: ['#E8631C', '#D1D5DB'], 
        plotOptions: {
            bar: { borderRadius: 6, columnWidth: '45%' }
        },
        dataLabels: { enabled: false },
        stroke: { show: true, width: 2, colors: ['transparent'] },
        xaxis: {
            categories: ['Des', 'Jan', 'Feb', 'Mar', 'Apr', 'Mei'],
            axisBorder: { show: false }
        },
        fill: { opacity: 1 },
        legend: { position: 'top', horizontalAlign: 'left' }
    };
    new ApexCharts(document.querySelector("#chart-arus-kas"), optionsArusKas).render();

    // 2. SETTINGAN MINI GRAPH (SPARKLINE COKOT DI POJOK CARD STATS)
    var sparkOptions = {
        series: [{ data: [30, 40, 35, 50, 49, 60, 70, 91] }],
        chart: { type: 'line', width: 90, height: 40, sparkline: { enabled: true } },
        stroke: { curve: 'smooth', width: 2 },
        colors: ['#E8631C'],
        tooltip: { enabled: false }
    };
    
    new ApexCharts(document.querySelector("#chart-spark-1"), sparkOptions).render();
    new ApexCharts(document.querySelector("#chart-spark-2"), sparkOptions).render();
    new ApexCharts(document.querySelector("#chart-spark-3"), sparkOptions).render();
    new ApexCharts(document.querySelector("#chart-spark-4"), sparkOptions).render();

    // 3. DONUT CHART SUMBER PEMASUKAN
    var optionsDonut = {
        series: [62, 22, 11, 5],
        chart: { type: 'donut', height: 200 },
        colors: ['#E8631C', '#F4A06A', '#B8962E', '#D1D5DB'],
        labels: ['Donasi Tetap', 'Infaq Jamaah', 'Kotak Amal', 'Lainnya'],
        dataLabels: { enabled: false },
        legend: { show: false },
        plotOptions: {
            pie: {
                donut: {
                    size: '70%',
                    labels: {
                        show: true,
                        total: {
                            show: true,
                            label: 'Total',
                            fontSize: '12px',
                            color: '#8C8375',
                            formatter: () => 'Rp 142jt'
                        }
                    }
                }
            }
        }
    };
    new ApexCharts(document.querySelector("#chart-donut"), optionsDonut).render();
</script>
