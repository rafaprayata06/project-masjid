<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const canvasEl = document.getElementById('arusKasChart');
        if (!canvasEl) {
            console.error("Elemen dengan ID 'arusKasChart' tidak ditemukan di halaman.");
            return;
        }

        // Ambil data kiriman dari Flask secara dinamis
        const chartLabels = {{ chart.labels | tojson }};
        const dataPemasukan = {{ chart.pemasukan | tojson }};
        const dataPengeluaran = {{ chart.pengeluaran | tojson }};

        const ctx = canvasEl.getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        label: 'Pemasukan',
                        data: dataPemasukan,
                        backgroundColor: '#E8631C',
                        borderRadius: 6
                    },
                    {
                        label: 'Pengeluaran',
                        data: dataPengeluaran,
                        backgroundColor: '#CBD5E1',
                        borderRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { 
                        position: 'top',
                        labels: {
                            boxWidth: 12,
                            font: { family: 'Plus Jakarta Sans, sans-serif', weight: '500' }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                if (value >= 1000000) return 'Rp ' + (value / 1000000) + 'jt';
                                if (value >= 1000) return 'Rp ' + (value / 1000) + 'rb';
                                return 'Rp ' + value;
                            }
                        }
                    }
                }
            }
        });
    });
</script>
