<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>
<body>

<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                
                <div class="card-body p-4">
                    <h4 class="text-center mb-4 fw-bold">Register</h4>

                 <form method="POST" action="/register" class="needs-validation" novalidate>

    <!-- NIM -->
    <div class="mb-3">
        <label class="form-label">NIM</label>
        <input type="text" name="nim" class="form-control" placeholder="Masukkan NIM" required>
        <div class="invalid-feedback">NIM wajib diisi.</div>
    </div>

    <!-- Nama -->
    <div class="mb-3">
        <label class="form-label">Nama</label>
        <input type="text" name="name" class="form-control" placeholder="Masukkan Nama" required>
        <div class="invalid-feedback">Nama wajib diisi.</div>
    </div>

    <!-- Jurusan -->
    <div class="mb-3">
        <label class="form-label">Jurusan</label>
        <input type="text" name="jurusan" class="form-control" placeholder="Contoh: Informatika" required>
        <div class="invalid-feedback">Jurusan wajib diisi.</div>
    </div>

    <!-- Jenis Kelamin -->
    <div class="mb-3">
        <label class="form-label d-block">Jenis Kelamin</label>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="jenis_kelamin" value="Laki-laki" id="laki" required>
            <label class="form-check-label" for="laki">Laki-laki</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="jenis_kelamin" value="Perempuan" id="perempuan" required>
            <label class="form-check-label" for="perempuan">Perempuan</label>
        </div>
        <!-- Pesan error khusus radio -->
        <div class="invalid-feedback d-block-none">Pilih jenis kelamin.</div>
    </div>

    <!-- Password -->
   <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" 
           name="password" 
           id="regPassword"
           class="form-control" 
           placeholder="Masukkan Password" 
           required>
    <div class="invalid-feedback">
        <!-- Teks ini akan diisi otomatis oleh JS -->
        <span id="passwordFeedback"></span>
    </div>
</div>
    <div class="d-grid">
        <button type="submit" class="btn btn-primary">Register</button>
    </div>
</form>

<!-- Tambahkan script validasi di bawah -->
<script>
(() => {
    'use strict'

    const form = document.querySelector('.needs-validation')
    const passwordInput = document.getElementById('regPassword')
    const passwordFeedback = document.getElementById('passwordFeedback')

    // Fungsi untuk cek syarat password (Min 5, Huruf & Angka)
    const validatePassword = () => {
        const val = passwordInput.value
        const regex = /^(?=.*[A-Za-z])(?=.*\d).+$/

        if (val.length === 0) {
            passwordInput.setCustomValidity('kosong')
            passwordFeedback.innerText = "Password tidak boleh kosong!"
        } else if (val.length < 5) {
            passwordInput.setCustomValidity('pendek')
            passwordFeedback.innerText = "Password terlalu pendek! Minimal 5 karakter."
        } else if (!regex.test(val)) {
            passwordInput.setCustomValidity('format')
            passwordFeedback.innerText = "Password harus kombinasi huruf dan angka!"
        } else {
            // Jika semua syarat terpenuhi
            passwordInput.setCustomValidity('')
        }
    }

    // Jalankan validasi setiap kali user mengetik
    passwordInput.addEventListener('input', validatePassword)

    // Validasi saat Submit
    form.addEventListener('submit', event => {
        validatePassword() // Pastikan dicek sekali lagi sebelum kirim

        if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
        }
        form.classList.add('was-validated')
    }, false)
})()
</script>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<script>
Swal.fire({
    icon: "{% if messages[0][0] == 'danger' %}error{% else %}{{ messages[0][0] }}{% endif %}",
    title: 'Informasi',
    text: '{{ messages[0][1] }}',
    confirmButtonText: 'OK'
});
</script>
{% endif %}
{% endwith %}
</body>
</html>
